name: 打包 Windows EXE

on:
  workflow_dispatch:            # 手动点 Run workflow 也能触发
  push:
    tags:
      - "v*"                    # 打 tag 时自动打包并发 Release

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: 准备 node.exe（打进 exe，搜索签名要用）
        shell: pwsh
        run: |
          $dst = Join-Path $pwd "node.exe"
          # 优先直接用 runner 自带的 Node，省一次外网下载
          $cmd = Get-Command node -ErrorAction SilentlyContinue
          if ($cmd) {
            Copy-Item $cmd.Source -Destination $dst -Force
            Write-Host "使用 runner 自带 node: $($cmd.Source)"
          } else {
            Write-Host "runner 无 node，改为下载便携版"
            Invoke-WebRequest -Uri "https://nodejs.org/dist/latest-v22.x/win-x64/node.exe" -OutFile $dst
          }
          & $dst --version
          if (-not (Test-Path $dst)) { throw "node.exe 准备失败" }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller ks_gui.spec --noconfirm --clean

      - name: 冒烟测试（资源齐全 + 内置签名链路通）
        shell: pwsh
        run: |
          $root = "dist\快手采集器"
          $exe  = Join-Path $root "快手采集器.exe"
          if (-not (Test-Path $exe)) { throw "未找到打包产物: $exe" }

          # PyInstaller 6 把数据文件放在 _internal，旧版放顶层，两个位置都找
          $dir = $null
          foreach ($d in @((Join-Path $root "_internal"), $root)) {
            if (Test-Path (Join-Path $d "node.exe")) { $dir = $d; break }
          }
          if (-not $dir) { throw "包内缺少 node.exe" }
          foreach ($f in @("sign.js", "jose.js")) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "包内缺少 $f" }
            Write-Host "资源 OK: $f"
          }

          # 用包内的 node 跑一次签名，确认 sig4 链路在 exe 里真能工作
          $payload = '{"cookie":"","url":"/rest/v/search/feed","query":{},"form":{},"requestBody":{"keyword":"乌拉","page":"search","webPageArea":"","pcursor":""}}'
          $out = & (Join-Path $dir "node.exe") (Join-Path $dir "sign.js") $payload
          if ($LASTEXITCODE -ne 0) { throw "内置 node 签名失败" }
          Write-Host "签名输出: $out"

      - name: 压缩
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\快手采集器\*" -DestinationPath "快手采集器-Windows-x64.zip" -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 快手采集器-Windows-x64
          path: 快手采集器-Windows-x64.zip
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 快手采集器-Windows-x64.zip
          generate_release_notes: true
